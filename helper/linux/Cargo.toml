[package]
name = "vivarium-helper-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Headless Wayland compositor that turns app windows into Vivarium tiles"
license = "MIT"
publish = false

[[bin]]
name = "vivarium-helper-linux"
path = "src/main.rs"

[features]
# GPU for clients via a render node (libgbm, linked; libEGL is loaded at runtime). Without it the
# helper still runs, with clients rendering into shared memory: `--no-default-features`.
default = ["gbm"]
gbm = ["smithay/backend_gbm"]

[dependencies]
# The protocol side of Smithay plus its GLES renderer (only used to import clients' GPU buffers
# and read them back, see gpu.rs). No DRM/KMS output, libinput or winit: we never show anything
# ourselves, so the binary runs under X11 and Wayland desktops alike.
smithay = { version = "=0.7.0", default-features = false, features = ["desktop", "wayland_frontend", "renderer_gl"] }
serde_json = "=1.0.154"
memmap2 = "=0.9.12"
libc = "=0.2.183"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true
